<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bacha Matcha &amp; Bakehouse</title>
  <meta name="description" content="Bacha - batter, matcha, and a little bit of cha. Build your box, leave feedback, find us online." />
  <meta name="theme-color" content="#FFF7F9" />
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/home.css">
</head>
<body class="home">
  <a class="home-skip" href="#home-actions">Skip to the buttons</a>

  <main class="home-wrap">
    <div class="home-logo">
      <img src="images/bacha_logo.jpg" alt="Bacha Matcha and Bakehouse" width="236" height="236" />
    </div>

    <h1 class="home-tagline">Batter, matcha, and a little bit of cha</h1>

    <nav id="home-actions" class="home-actions" aria-label="Main">
      <a class="home-btn home-btn--order" href="shop.html"><span class="ico" aria-hidden="true">🍪</span>Order</a>
      <a class="home-btn home-btn--feedback" href="feedback.html"><span class="ico" aria-hidden="true">💌</span>Feedback</a>
      <button type="button" class="home-btn" id="social-btn" aria-haspopup="dialog"><span class="ico" aria-hidden="true">✨</span>Social media</button>
    </nav>

    <p class="home-foot">© Bacha Matcha &amp; Bakehouse · <a href="shop.html#staff">Staff login</a></p>
  </main>

  <!-- SOCIAL MEDIA POP-UP: shows the links saved in the admin (Store control -> Payments, delivery & socials) -->
  <div id="social-modal" class="home-modal" hidden>
    <div class="home-sheet" role="dialog" aria-modal="true" aria-labelledby="social-title">
      <button type="button" class="home-x" id="social-close" aria-label="Close">×</button>
      <h2 id="social-title">Find us online</h2>
      <p>Follow along for fresh bake drops ♡</p>
      <ul class="home-links" id="social-list" aria-live="polite"></ul>
    </div>
  </div>

  <script src="vendor/supabase.js"></script>
  <script src="js/home-common.js"></script>
  <script>
    (function () {
      const modal = document.getElementById('social-modal'), list = document.getElementById('social-list');
      let release = null, loaded = null, loading = false;

      function render(links) {
        const good = (links || []).map(l => ({ platform: l.platform, href: Home.safeUrl(l.url) })).filter(l => l.href);
        if (!good.length) { list.innerHTML = '<li class="home-empty">Our links are coming soon. Check back in a bit!</li>'; return; }
        list.innerHTML = good.map(l => `<li><a class="home-link" href="${Home.esc(l.href)}" target="_blank" rel="noopener noreferrer">
          <span class="ico" aria-hidden="true">${Home.icon(l.platform)}</span>
          <span class="txt"><span class="name">${Home.esc(l.platform)}</span><span class="url">${Home.esc(Home.pretty(l.href))}</span></span>
          <span class="go" aria-hidden="true">↗</span><span class="home-sr">(opens in a new tab)</span></a></li>`).join('');
      }
      function open() {
        modal.hidden = false;
        document.body.style.overflow = 'hidden';
        release = Home.trapFocus(modal, close);
        const cached = loaded || Home.cachedSocials();
        if (cached) render(cached); else list.innerHTML = '<li class="home-empty">Loading…</li>';
        if (!loading) {
          loading = true;
          Home.loadSocials().then(l => { loaded = l; render(l); }).finally(() => { loading = false; });
        }
        setTimeout(() => (list.querySelector('a') || document.getElementById('social-close')).focus(), 30);
      }
      function close() {
        modal.hidden = true; document.body.style.overflow = '';
        if (release) { release(); release = null; }
      }
      document.getElementById('social-btn').addEventListener('click', open);
      document.getElementById('social-close').addEventListener('click', close);
      modal.addEventListener('mousedown', e => { if (e.target === modal) close(); });
      Home.loadSocials().then(l => { loaded = l; });   // warm up so the pop-up is instant
    })();
  </script>
</body>
</html>
